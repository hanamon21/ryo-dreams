const UNCLASSIFIED='登録区分未設定';

function stageBucket(personOrStage){
 const p=personOrStage&&typeof personOrStage==='object'?personOrStage:{stage:personOrStage};
 const s=p.stage||'アポ前';
 if(s==='アポ調整中'||s==='説明後')return 'ご案内中';
 if(s==='活動中')return 'ビジネスメンバー';
 if(s==='登録済み'||s==='初期育成'||s===UNCLASSIFIED){
   if(p.registrationType==='愛用')return '登録済み（愛用）';
   if(p.registrationType==='ビジネス')return '登録済み（ビジネス）';
   return UNCLASSIFIED;
 }
 return s;
}

 const named=[...new Set(['花本良','梅村卓亨',...people.map(p=>(p.directSponsor||'').trim()).filter(Boolean)])];

}

  if(newRows.length)await cloudRequest(cloudUrl(CLOUD_SHEET+'!A:F')+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:newRows})});

  cloud.baselineKnown=true;cloud.lastSuccessAt=new Date().toISOString();persistCloudBaseline();cloud.state='接続済み';
  if(edits.length||newRows.length)toast('Googleクラウドに保存できました ✓');
 }catch(err){cloud.state='同期エラー';toast('クラウド同期に失敗。端末には保存済み：'+err.message)}

}
async function cloudRefresh(){
 if(!cloud.ready||!cloud.accessToken||cloud.busy||cloud.pendingConflicts.length)return;
 if(document.activeElement?.matches?.('[data-field]'))return;
 if(pendingCount()){cloudSchedule();return}
 cloud.busy=true;
 try{
  const fresh=await cloudReadRows();
  const changed=fresh.people.length!==people.length||fresh.people.some(p=>cloud.snapshots.get(p.id)!==JSON.stringify(p));
  if(changed){
   recoveryBackup('他端末の変更を取り込む前');people=fresh.people;
   localStorage.setItem(STORE_KEY,JSON.stringify(people));
   if(ui.personId&&!people.some(p=>p.id===ui.personId)){ui.personId=null;ui.view='list'}
   render();toast('他端末の変更を反映しました。');
  }
  cloud.rows=fresh.rows;cloud.snapshots=fresh.snapshots;cloud.baselineKnown=true;cloud.lastSuccessAt=new Date().toISOString();persistCloudBaseline();
 }catch(err){cloud.state='更新確認エラー';toast('クラウド確認できません：'+err.message)}
 finally{cloud.busy=false;updateSyncBanner()}
}

function sheetText(p,type){const title=SHEETS.find(s=>s.id===type);const list=fields[type];const first=type==='new'?'紹介者名：':'紹介者：';let str=`${title.icon}【${title.title}】${title.icon}\n\n${first}${p.introducer||'未確認'}${p.directSponsor?'\n直紹介者：'+p.directSponsor:''}`;const extra=(type==='new')?'★':'★';for(const f of list){let prefix=(type==='member'||type==='miho')&&['registrationDate','registrationType','businessActivity','seminarSummary','leaderAdvice','spiritLeader','mihoInvitation','accompanyLeader'].includes(f.key)?'●':f.key==='approach'||f.key==='reason'?'◎':'★';let label=f.label.replace('（参加履歴から自動表示）','').replace('（ポジティブ・ネガティブ）','').replace('（どれで登録になったか？）','').replace('（例：ルテイン3M）','').replace('（あり・なし、ありなら詳細）','');let v=val(p,f.key);if(f.type==='date')v=v?dstr(v):'';str+=`\n\n${prefix}${label}\n${v||'未確認'}`}return str}
function historyText(p,type){const hist=(p.sharedHistory||[]).filter(h=>h.type===type);if(!hist.length)return '送信履歴：まだありません';const last=hist[hist.length-1];return `送信済み記録：${esc(new Date(last.at).toLocaleString('ja-JP'))}　（計${hist.length}回）`}
function renderProgress(p){const completed=(p.sessions||[]).length;const checks=p.checks||{};const allChecks=CHECKS.length+1;const done=CHECKS.filter(([key])=>!!checks[key]).length+(completed>=3?1:0);return `<div class="progress-grid"><div class="card card-pad full"><div class="section-title">現在の状況・次回アクション</div><div class="section-note">ここが更新されていれば、次に何をするか迷いません。</div><div class="field-grid" style="margin-top:17px"><div class="field"><label>現在のステータス</label><select class="select" data-field="stage">${stageBucket(p)===UNCLASSIFIED?`<option value="" selected disabled>登録区分が未設定（選択してください）</option>`:''}${STAGES.map(s=>`<option ${stageBucket(p)===s?'selected':''}>${esc(s)}</option>`).join('')}</select>${registrationEditor(p)}</div><div class="field"><label>次回アクションの日付</label><div class="date-with-clear"><input type="date" class="input" data-field="nextDate" value="${esc(p.nextDate||'')}"><button class="btn small" type="button" data-action="clear-next-date">日付を消す</button></div></div><div class="field wide"><label>直紹介者（直接紹介した1名）</label><input class="input" list="sponsor-name-options-progress" data-field="directSponsor" value="${esc(p.directSponsor||'')}" placeholder="例：花本良"><datalist id="sponsor-name-options-progress">${sponsorChoices().map(name=>`<option value="${esc(name)}"></option>`).join('')}</datalist><div class="small-muted">紹介者名・担当者とは別に管理し、人物一覧から絞り込めます。</div></div><div class="field wide"><label>次にすること</label><input class="input" data-field="nextAction" value="${esc(p.nextAction||'')}" placeholder="例：ゆりさんとの面談日程を確認"></div></div></div><div class="card card-pad full"><div class="section-title">活動の進捗</div><div class="section-note">チェックするだけ。セミナーの参加回数は自動集計されます。</div><div style="display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:16px"><div class="small-muted">${done} / ${allChecks} 項目完了</div><strong>${Math.round(done/allChecks*100)}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${done/allChecks*100}%"></div></div><div class="checks">${CHECKS.map(([key,label])=>`<label class="check-item"><input type="checkbox" data-check="${key}" ${checks[key]?'checked':''}><span>${esc(label)}</span></label>`).join('')}<div class="check-item" style="color:${completed>=3?'#16745e':'#667985'}"><span style="font-size:18px">${completed>=3?'☑':'□'}</span><span>セミナー3回（${completed}/3回）</span></div></div>${yuriConnectionDateHtml(p,checks)}<div class="note" style="margin-top:14px">初期目標：フェロートレーニング参加＋花井美穂さんとの面談。セミナー3回は活動目標として表示しています。</div></div><div class="card card-pad full"><div class="section-title">セミナー参加履歴</div><div class="section-note">同じ種類に複数回参加しても記録できます。</div><div class="session-form"><select id="seminar-type" class="select">${SEMINARS.map(s=>`<option ${ui.seminarType===s?'selected':''}>${esc(s)}</option>`).join('')}</select>${seminarFormatFieldHtml()}<input type="date" id="seminar-date" class="input" value="${esc(ui.seminarDate)}"><button class="btn primary" data-action="add-seminar">＋ 参加を記録</button></div><div class="sessions">${(p.sessions||[]).length?p.sessions.map(s=>`<div class="session"><div><div class="session-title">${esc(seminarLabel(s))}</div><div class="session-date">${esc(s.date?dstr(s.date):'日付未設定')}</div></div><div class="session-actions">${seminarHistoryAction(s)}<button class="btn small danger" data-action="remove-seminar" data-id="${esc(s.id)}">削除</button></div></div>`).join(''):'<div class="small-muted" style="padding-top:10px">まだ参加履歴はありません。</div>'}</div></div></div>`}
function toast(msg){const node=document.getElementById('toast-root');node.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.innerHTML='',3500)}
function uid(){return (globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2))}
function openModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function newPersonModal(){openModal(`<h2>＋ 人物を追加</h2><div class="small-muted">名前だけで登録できます。情報は後で入力。</div><form id="new-form"><div class="field"><label>名前（必須）</label><input required maxlength="100" class="input" name="name" placeholder="例：山田さん" autofocus></div><div class="field"><label>紹介者</label><input class="input" name="introducer" maxlength="100" placeholder="例：花本良"></div><div class="field"><label>担当者</label><input class="input" name="owner" maxlength="100" placeholder="例：花本良"></div><div class="field"><label>直紹介者（1名）</label><input class="input" name="directSponsor" maxlength="100" placeholder="例：花本良"></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button type="submit" class="btn primary">登録する</button></div></form>`)}
function backupModal(){openModal(`<h2>バックアップ・復元</h2><p class="small-muted">情報はこの端末のブラウザに保存されます。取り込み前にバックアップを保存してください。『ゲストシートを更新・追加』なら、既存人物のシート情報だけを更新し、活動進捗・セミナー履歴・送信履歴は維持します。</p><div class="note notice-warn"><strong>注意：</strong>バックアップは暗号化されていません。個人情報を含む状態では、他人に送信したり、公開フォルダへ置いたりしないでください。</div><div class="actionrow" style="margin-top:15px"><button class="btn primary" data-action="export">バックアップを保存</button><button class="btn dark" data-action="choose-import-update">ゲストシートを更新・追加</button><button class="btn" data-action="choose-import-merge">空欄だけ補完</button><button class="btn" data-action="choose-import-replace">全件置き換え（復元）</button></div><input id="backup-file" class="hidden" type="file" accept="application/json,.json"><div class="modal-actions"><button class="btn" data-action="close-modal">閉じる</button></div>`)}
async function copy(txt){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true}const el=document.createElement('textarea');el.value=txt;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.focus();el.select();const ok=document.execCommand('copy');el.remove();return ok}catch(e){return false}}
async function shareSheet(){const p=person();const txt=sheetText(p,ui.sheet);if(navigator.share){try{await navigator.share({title:`${p.name}・${SHEETS.find(s=>s.id===ui.sheet).title}`,text:txt});toast('共有操作を完了しました。実際の送信済み記録は別途行ってください。');return}catch(e){if(e.name==='AbortError')return}}const okay=await copy(txt);toast(okay?'共有できない環境のため、本文をコピーしました。':'共有できませんでした。コピー機能をお試しください。')}
function updateField(field,value){const p=person();if(!p)return;p[field]=value;
 if(field==='stage'&&['登録済み（愛用）','登録済み（ビジネス）','ビジネスメンバー'].includes(value)){p.checks=p.checks||{};p.checks.registered=true}
 p.updatedAt=new Date().toISOString();save()}
function changeView(view){if(['sheet','progress'].includes(view)&&!person()){if(people.length){ui.personId=people[0].id}else{ui.view='list';render();toast('先に人物を登録してください。');return}}ui.view=view;render();window.scrollTo({top:0,behavior:'instant'})}

function importRecords(payload,mode){
 if(!payload || payload.app!=='RE:RISE Manager' || !Array.isArray(payload.people) || payload.people.length>3000) throw Error('形式が一致しません');
 if(payload.people.some(p=>!p || typeof p!=='object' || typeof p.name!=='string' || !p.name.trim() || p.name.length>120)) throw Error('人物データに不正な項目があります');
 const next=payload.people.map(p=>({...p,id:String(p.id||uid()),checks:p.checks&&typeof p.checks==='object'?p.checks:{},sessions:Array.isArray(p.sessions)?p.sessions:[],sharedHistory:Array.isArray(p.sharedHistory)?p.sharedHistory:[]}));
 if(mode==='replace'){
  if(!confirm(`既存の${people.length}名を削除して、読み込んだ${next.length}名で置き換えます。よろしいですか？`))return null;
  people=next;return {added:next.length,filled:0,skipped:0};
 }
 if(mode==='update'){
  // Only public schema fields belonging to guest sheets are updateable. Never overwrite progress/registration history.
  const writable=new Set(['age','location','job','personality','family','relation','features','health','economy','freeTime','friends','hobbies','approach','reason','introducer','directSponsor','networkExperience']);
  const norm=x=>String(x||'').replace(/[\s　・さん様]/g,'').toLowerCase();
  const matching=next.filter(p=>people.some(old=>norm(old.name)===norm(p.name)));
  const adding=next.filter(p=>!people.some(old=>norm(old.name)===norm(p.name)));
  const names=next.map(p=>p.name).join('、');
  if(!confirm(`ゲストシート更新を実行しますか？\n既存 ${matching.length}名を更新・新規 ${adding.length}名を追加\n対象：${names}\n\n既存の活動進捗・参加履歴・送信履歴・登録状況は保持します。`))return null;
  let changed=0;
  for(const incoming of next){
   const old=people.find(p=>norm(p.name)===norm(incoming.name));
   if(!old){
    // Keep add-only defaults without treating a planned outreach as completed.
    people.push({...incoming,stage:'アポ前',nextAction:'',nextDate:'',owner:incoming.introducer||'',checks:{},sessions:[],sharedHistory:[],registrationDate:'',createdAt:new Date().toISOString()});
    continue;
   }
   for(const key of writable){
    if(!Object.hasOwn(incoming,key))continue;
    const value=incoming[key];
    if(typeof value!=='string'||!value.trim())continue;
    if(old[key]!==value){old[key]=value;changed++;}
   }
   old.updatedAt=new Date().toISOString();
  }
  return {added:adding.length,filled:changed,skipped:0,updated:matching.length};
 }
 let added=0,filled=0,skipped=0;
 for(const incoming of next){
  const norm=x=>String(x||'').replace(/[\s　・さん様]/g,'').toLowerCase();
  const old=people.find(p=>norm(p.name)===norm(incoming.name));
  if(!old){people.push(incoming);added++;continue;}
  for(const [key,value] of Object.entries(incoming)){
   if(['id','name','createdAt','updatedAt','sharedHistory','sourceNote'].includes(key))continue;
   if(key==='checks' && value && typeof value==='object'){
    old.checks=old.checks||{};
    for(const [ck,cv] of Object.entries(value)){if(old.checks[ck]===undefined){old.checks[ck]=cv;filled++;}}
   }else if(key==='sessions'&&Array.isArray(value)){
    old.sessions=old.sessions||[];
    for(const s of value){if(!old.sessions.some(prev=>prev.type===s.type && prev.date===s.date)){old.sessions.push(s);filled++;}}
   }else if((old[key]===undefined || old[key]===null || old[key]==='') && value!==undefined && value!==null && value!=='' && !Array.isArray(value) && typeof value!=='object'){
    old[key]=value;filled++;
   }else skipped++;
  }
 }
 return {added,filled,skipped};
}
document.addEventListener('click',async e=>{if(e.target.dataset.backdrop){closeModal();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const p=person();
 if(a==='go-list'){ui.filter='すべて';ui.sponsorFilter='すべて';ui.search='';changeView('list');return}
 if(a==='back-to-list'){changeView('list');return}
 if(a==='filter-stage'){ui.filter=b.dataset.stage;render();return}
 if(a==='filter-sponsor'){ui.sponsorFilter=b.dataset.sponsor;render();return}
 if(a==='go-due'){ui.filter='要対応';ui.search='';changeView('list');return}
 if(a==='go-settings'){changeView('settings');return}
 if(a==='go-sheet'||a==='go-progress'){changeView(a.slice(3));return}
 if(a==='new-person'){newPersonModal();return}
 if(a==='clear-next-date'){if(!p)return;updateField('nextDate','');render();toast('次回アクションの日付を消しました。');return}
 if(a==='close-modal'){closeModal();return}
 if(a==='backup'){backupModal();return}
 if(a==='cloud-config'){cloudConfigSave();return}
 if(a==='cloud-login'){cloudSignIn();return}
 if(a==='cloud-pull'){await cloudPull();return}
 if(a==='cloud-flush'){if(!cloud.ready){toast('Googleへの接続が必要です。端末の内容は保持中。');return}await cloudFlush();return}
 if(a==='sync-resolve'){showCloudConflicts();return}
 if(a==='recovery-list'){showRecovery();return}
 if(a==='restore-snapshot'){restoreSnapshot(Number(b.dataset.ref));return}
 if(a==='resolve-local'||a==='resolve-remote'){resolveCloudConflict(b.dataset.id,a==='resolve-local'?'local':'remote');return}
 if(a==='open-person'){ui.personId=b.dataset.id;ui.sheet='new';ui.mode='edit';changeView('sheet');return}
 if(a==='sheet-type'){ui.sheet=b.dataset.id;ui.mode='edit';render();return}
 if(a==='mode'){ui.mode=b.dataset.id;render();return}
 if(a==='copy-sheet'){const ok=await copy(sheetText(p,ui.sheet));toast(ok?'ゲストシート全文をコピーしました。':'コピーできませんでした。プレビューから手動でコピーしてください。');return}
 if(a==='share-sheet'){await shareSheet();return}
 if(a==='record-send'){p.sharedHistory=p.sharedHistory||[];p.sharedHistory.push({type:ui.sheet,at:new Date().toISOString(),snapshot:sheetText(p,ui.sheet)});save();render();toast('送信済みとして記録しました。');return}
 if(a==='delete-person'){if(confirm(`${p.name}さんの情報を削除します。元に戻せません。よろしいですか？`)){people=people.filter(x=>x.id!==p.id);save();ui.personId=null;changeView('list');toast('削除しました。')}return}
 if(a==='add-seminar'){const type=document.getElementById('seminar-type').value;const date=document.getElementById('seminar-date').value;const format=document.getElementById('seminar-format').value;if(isBusinessSeminar(type)&&!['Zoom','リアル'].includes(format)){toast('事業説明会はZoomかリアルを選択してください。');return}p.sessions=p.sessions||[];const record={id:uid(),type,date};if(isBusinessSeminar(type))record.format=format;p.sessions.push(record);if(type==='フェロートレーニング'){p.checks=p.checks||{};p.checks.fellow=true}p.updatedAt=new Date().toISOString();save();render();toast('参加履歴を追加しました。');return}
 if(a==='remove-seminar'){if(confirm('この参加履歴を削除しますか？')){p.sessions=p.sessions.filter(s=>s.id!==b.dataset.id);p.updatedAt=new Date().toISOString();save();render()}return}
 if(a==='export'){const data=JSON.stringify({app:'RE:RISE Manager',version:1,exportedAt:new Date().toISOString(),people},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const an=document.createElement('a');an.href=url;an.download='RE-RISE-backup-'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを保存しました。');return}
 if(a==='choose-import-merge'||a==='choose-import-replace'||a==='choose-import-update'){importMode=a==='choose-import-update'?'update':a==='choose-import-merge'?'merge':'replace';document.getElementById('backup-file').click();return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;renderPeople();return}if(e.target.dataset.field)updateField(e.target.dataset.field,e.target.value)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.check){const p=person();if(!p)return;p.checks=p.checks||{};if(t.dataset.check==='yuriConnected'){if(!t.checked&&p.yuriConnectedDate&&!confirm('ゆりさんに繋いだ記録と日付を取り消しますか？')){t.checked=true;return}if(t.checked&&!p.yuriConnectedDate)p.yuriConnectedDate=new Date().toLocaleDateString('sv-SE');if(!t.checked)p.yuriConnectedDate=''}p.checks[t.dataset.check]=t.checked;if(t.dataset.check==='registered' && t.checked && ['アポ前','ご案内中'].includes(stageBucket(p)))p.stage=p.registrationType==='愛用'?'登録済み（愛用）':p.registrationType==='ビジネス'?'登録済み（ビジネス）':UNCLASSIFIED;p.updatedAt=new Date().toISOString();save();render();return}if(t.dataset.field){updateField(t.dataset.field,t.value);if(['name','stage','registrationType','owner','introducer','directSponsor','nextAction','nextDate','yuriConnectedDate','registrationDate'].includes(t.dataset.field))render();return}if(t.dataset.sessionFormat){const p=person();const item=(p?.sessions||[]).find(s=>String(s.id)===t.dataset.sessionFormat);if(item&&isBusinessSeminar(item.type)){item.format=t.value;p.updatedAt=new Date().toISOString();save();render();toast('事業説明会の開催形式を更新しました。')}return}if(t.id==='seminar-type'){ui.seminarType=t.value;const formatSelect=document.getElementById('seminar-format');if(formatSelect){formatSelect.disabled=!isBusinessSeminar(t.value);if(formatSelect.disabled){formatSelect.value='';ui.seminarFormat=''}}return}if(t.id==='seminar-format'){ui.seminarFormat=t.value;return}if(t.id==='seminar-date'){ui.seminarDate=t.value;return}if(t.id==='backup-file'){const f=t.files?.[0];if(!f)return;f.text().then(raw=>{try{const j=JSON.parse(raw);if(j.app!=='RE:RISE Manager'||!Array.isArray(j.people))throw Error('形式が一致しません');const report=importRecords(j,importMode);if(!report)return;save();closeModal();ui.view='list';ui.personId=null;ui.filter='すべて';render();toast(importMode==='update'?`更新完了：${report.updated}人更新・${report.added}人追加・${report.filled}項目変更`:`取り込み完了：${report.added}人追加・${report.filled}項目補完`);}catch(err){toast('読み込みに失敗：'+(err.message||'ファイル形式を確認してください。'))}});return}});
document.addEventListener('submit',e=>{if(e.target.id==='new-form'){e.preventDefault();const form=new FormData(e.target);const name=String(form.get('name')||'').trim();if(!name)return;const p={id:uid(),name,introducer:String(form.get('introducer')||''),owner:String(form.get('owner')||''),directSponsor:String(form.get('directSponsor')||'').trim(),stage:'アポ前',nextAction:'',nextDate:'',checks:{},sessions:[],sharedHistory:[],createdAt:new Date().toISOString()};people.unshift(p);ui.filter='アポ前';save();closeModal();ui.personId=p.id;ui.sheet='new';ui.mode='edit';changeView('sheet');toast('人物を登録しました。')}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
render();
})();
</script>
