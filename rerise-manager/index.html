<script>
(()=>{'use strict';

const fields={

 registered:[F('registrationPath','BC又ABC又セミナー（どれで登録になったか？）',false,'select',['','BC','ABC','セミナー','その他']),F('speaker','Aさん 又は講師（名前）'),F('registrationType','ビジネス・愛用・付き合い',false,'select',['','ビジネス','愛用','付き合い']),F('products','登録製品と購入期間（例：ルテイン3M）'),F('name','新規名前'),F('age','年齢（年代）'),F('location','住まい'),F('job','職業'),F('personality','性格（ポジティブ・ネガティブ）',true,'textarea'),F('family','家族構成',true,'textarea'),F('relation','自分との関係',true,'textarea'),F('networkExperience','ネットワーク経験（あり・なし、ありなら詳細）',true,'textarea'),F('registrationStory','登録に至った経緯',true,'textarea'),F('nextGuidance','次の案内何をしたか？？',true,'textarea')],
 member:[F('name','名前'),F('age','年齢（年代）'),F('location','住まい'),F('job','職業'),F('personality','性格（ポジティブ・ネガティブ）',true,'textarea'),F('family','家族構成',true,'textarea'),F('hobbies','趣味や夢',true,'textarea'),F('registrationDate','登録日（年月日）',false,'date'),F('registrationType','登録時：愛用・付き合い・ビジネス',false,'select',['','愛用','付き合い','ビジネス']),F('businessActivity','ビジネス開始からの動き',true,'textarea'),F('seminarSummary','セミナー参加の有無（参加履歴から自動表示）',true,'auto'),F('leaderAdvice','一言アドバイスしてもらいたいこと',true,'textarea')],
 miho:[F('name','名前'),F('age','年齢（年代）'),F('location','住まい'),F('job','職業'),F('family','家族構成',true,'textarea'),F('hobbies','趣味や夢',true,'textarea'),F('registrationDate','登録日（年月日）',false,'date'),F('registrationType','登録時：愛用・付き合い・ビジネス',false,'select',['','愛用','付き合い','ビジネス']),F('businessActivity','ビジネス開始からの動き',true,'textarea'),F('seminarSummary','セミナー参加の有無（参加履歴から自動表示）',true,'auto'),F('spiritLeader','スピリット以上リーダーで繋いだ人',true,'textarea'),F('mihoInvitation','なんと言って美穂面談誘導したか？',true,'textarea'),F('accompanyLeader','面談同行リーダーの名前')]
};
const CHECKS=[['registered','新規登録'],['fellow','フェロートレーニング'],['miho','花井美穂さんとの面談'],['list100','100人リスト'],['dream','夢リスト'],['outreach','声かけ・連絡'],['marketing','マーケティング練習'],['meeting','打ち合わせ'],['report','活動報告']];

// Cloud data: private Google Sheet accessed with the signed-in user's short-lived OAuth token.
const CLOUD_SETTINGS_KEY='rerise.manager.cloud.v1';
const CLOUD_DEFAULT_ID='19i7zJ7bDYrlB4MWGW23r9UlLr-f8DKsqRztylSzKR6M';
const cloudSaved=(()=>{try{return JSON.parse(localStorage.getItem(CLOUD_SETTINGS_KEY)||'{}')}catch{return {}}})();
const cloud={clientId:cloudSaved.clientId||'',spreadsheetId:cloudSaved.spreadsheetId||CLOUD_DEFAULT_ID,accessToken:'',state:'未接続',ready:false,rows:new Map(),snapshots:new Map(),timer:null,busy:false,dirtyCounter:0,pendingConflicts:[]};
const API='https://sheets.googleapis.com/v4/spreadsheets/';
const CLOUD_SHEET='People';
function cloudMessage(){return cloud.ready?'同期中'+(cloud.busy?'…':'（自動同期ON）'):cloud.accessToken?'Google認証済み・未読み込み':'未接続（端末内保存）'}
function cloudConfigSave(){let id=document.getElementById('google-client-id')?.value.trim()||'';let sid=document.getElementById('google-sheet-id')?.value.trim()||'';sid=sid.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]+)/)?.[1]||sid;if(sid&&!/^[A-Za-z0-9_-]{20,}$/.test(sid)){toast('スプレッドシートIDが正しくありません');return}if(id&&!/^[0-9]+-[a-z0-9_-]+\.apps\.googleusercontent\.com$/.test(id)){toast('Google OAuthクライアントIDを確認してください');return}if(cloud.accessToken&&cloud.spreadsheetId!==sid){cloud.accessToken='';cloud.ready=false;}cloud.clientId=id;cloud.spreadsheetId=sid||CLOUD_DEFAULT_ID;localStorage.setItem(CLOUD_SETTINGS_KEY,JSON.stringify({clientId:cloud.clientId,spreadsheetId:cloud.spreadsheetId}));toast('Google連携設定を保存しました');render()}
function cloudSignIn(){
 if(!cloud.clientId){toast('先にGoogle OAuthクライアントIDを設定・保存してください');return}
 if(!window.google?.accounts?.oauth2){toast('Google認証ライブラリを読み込めません。通信環境をご確認ください');return}
 const auth=google.accounts.oauth2.initTokenClient({client_id:cloud.clientId,scope:'https://www.googleapis.com/auth/spreadsheets',callback:async response=>{
   if(response.error||!response.access_token){toast('Google認証に失敗しました');return}
   cloud.accessToken=response.access_token;cloud.ready=false;cloud.state='認証済み';
   toast('Google認証が完了しました。');render();if(!people.length)await cloudPull();
 },error_callback:()=>toast('Google認証がキャンセルされました')});
 auth.requestAccessToken({prompt:'consent'});
}
function cloudUrl(range){if(!cloud.spreadsheetId)throw Error('シートID未設定');return API+encodeURIComponent(cloud.spreadsheetId)+'/values/'+encodeURIComponent(range)}
async function cloudRequest(url,opts={}){
 if(!cloud.accessToken)throw Error('Google認証が必要です');
 const response=await fetch(url,{...opts,headers:{Authorization:'Bearer '+cloud.accessToken,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})},cache:'no-store'});
 const payload=await response.json().catch(()=>({}));
 if(!response.ok){if(response.status===401){cloud.ready=false;cloud.accessToken=''}throw Error(response.status===403?'シートへのアクセス権限がありません。共有設定を確認してください':(payload.error?.message||'Google APIエラー '+response.status))}
 return payload;
}
async function cloudReadRows(){
 const x=await cloudRequest(cloudUrl(CLOUD_SHEET+'!A1:F3000'));
 const arr=x.values||[];
 if(arr.length===0||arr[0][0]!=='person_id'||arr[0][4]!=='person_json')throw Error('Peopleシートの列が一致しません');
 const found=[];const rows=new Map();const snapshots=new Map();
 for(let i=1;i<arr.length;i++){
  const row=arr[i];if(!row?.[0]||!row?.[4])continue;
  let p;try{p=JSON.parse(row[4])}catch{throw Error(`${i+1}行目のJSONが正しくありません`)}
  if(p.id!==row[0]||!p.name)throw Error(`${i+1}行目の人物IDに不整合があります`);
  if(rows.has(p.id))throw Error('重複する人物ID：'+p.id);
  found.push(p);rows.set(p.id,i+1);snapshots.set(p.id,JSON.stringify(p));
 }
 return {people:found,rows,snapshots};
}
async function cloudPull(){
 if(!cloud.accessToken){toast('Googleにログインしてください');return}
 if(cloud.ready&&cloud.dirtyCounter>0&&cloud.busy){toast('同期処理中です');return}
 if(people.length&&!confirm('クラウドの人物情報で現在の画面を置き換えます。端末内の現在の情報は自動バックアップしてから読み込みます。よろしいですか？'))return;
 try{
  cloud.state='読み込み中';const result=await cloudReadRows();
  localStorage.setItem('rerise.manager.pre-cloud-backup.'+Date.now(),JSON.stringify(people));
  people=result.people;cloud.rows=result.rows;cloud.snapshots=result.snapshots;cloud.ready=true;cloud.dirtyCounter=0;cloud.pendingConflicts=[];
  localStorage.setItem(STORE_KEY,JSON.stringify(people));ui.view='list';ui.personId=null;ui.filter='すべて';cloud.state='接続済み';render();toast(`${people.length}名をクラウドから読み込みました。編集は自動同期されます。`);
 }catch(err){cloud.ready=false;cloud.state='読み込みエラー';toast('読み込み失敗：'+err.message)}
}
function cloudSchedule(){if(!cloud.ready)return;cloud.dirtyCounter++;clearTimeout(cloud.timer);cloud.timer=setTimeout(()=>cloudFlush(),1800)}
async function cloudFlush(){
 if(!cloud.ready||!cloud.accessToken||cloud.busy)return;
 cloud.busy=true;const revision=cloud.dirtyCounter;
 try{
  const current=await cloudReadRows();
  const local=new Map(people.map(p=>[p.id,p]));
  const prev=cloud.snapshots;
  const edits=[];const newRows=[];const conflicts=[];
  const stale=[];
  // This compares every known row against the last successfully synchronized version.
  // If another editor changed the same person remotely, do not overwrite their data.
  for(const [id,record] of local){
   const serialized=JSON.stringify(record);
   if(prev.has(id)&&prev.get(id)===serialized)continue;
   if(current.snapshots.has(id)){
    if(prev.has(id)&&prev.get(id)!==current.snapshots.get(id)){conflicts.push(record.name);continue}
    const rowIndex=current.rows.get(id);
    edits.push({range:`'${CLOUD_SHEET}'!A${rowIndex}:F${rowIndex}`,values:[[id,record.name,record.stage||'',record.updatedAt||'',serialized,record.owner||'']]});
   }else if(!prev.has(id)){
    newRows.push([id,record.name,record.stage||'',record.updatedAt||'',serialized,record.owner||'']);
   }else conflicts.push(record.name);
  }
  for(const [id,serialized] of prev){
   if(local.has(id))continue;
   if(current.snapshots.has(id)&&current.snapshots.get(id)!==serialized){conflicts.push(id);continue}
   if(current.rows.has(id)){const n=current.rows.get(id);edits.push({range:`'${CLOUD_SHEET}'!A${n}:F${n}`,values:[['','','','','','']]});stale.push(id)}
  }
  if(conflicts.length){cloud.pendingConflicts=conflicts;cloud.state='競合あり';toast('他の端末で同じ人物が更新されています：'+conflicts.join('、')+'。クラウドから読み込み直してください。');return}
  if(edits.length){await cloudRequest(API+encodeURIComponent(cloud.spreadsheetId)+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:edits})})}
  if(newRows.length){await cloudRequest(cloudUrl(CLOUD_SHEET+'!A:F')+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:newRows})})}
  const refreshed=await cloudReadRows();cloud.rows=refreshed.rows;cloud.snapshots=refreshed.snapshots;cloud.state='接続済み';cloud.pendingConflicts=[];
  if(edits.length||newRows.length)toast('クラウドへ同期しました');
 }catch(err){cloud.state='同期エラー';toast('同期できませんでした：'+err.message)}
 finally{cloud.busy=false;if(cloud.ready&&cloud.dirtyCounter!==revision)cloudSchedule();}
}
async function cloudRefresh(){
 if(!cloud.ready||!cloud.accessToken||cloud.busy||cloud.pendingConflicts.length)return;
 const localIds=new Set(people.map(p=>p.id));
 if(people.some(p=>cloud.snapshots.get(p.id)!==JSON.stringify(p))||[...cloud.snapshots.keys()].some(id=>!localIds.has(id)))return;
 cloud.busy=true;
 try{const fresh=await cloudReadRows();const changed=fresh.people.length!==people.length||fresh.people.some(p=>cloud.snapshots.get(p.id)!==JSON.stringify(p));if(changed){people=fresh.people;cloud.rows=fresh.rows;cloud.snapshots=fresh.snapshots;localStorage.setItem(STORE_KEY,JSON.stringify(people));if(ui.personId&&!people.some(p=>p.id===ui.personId)){ui.personId=null;ui.view='list'}render();toast('最新のクラウド情報を反映しました。')}}
 catch(err){cloud.state='同期エラー';toast('更新確認に失敗：'+err.message)}finally{cloud.busy=false;}
}

function openModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-wrap" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function newPersonModal(){openModal(`<h2>＋ 人物を追加</h2><div class="small-muted">名前だけで登録できます。情報は後で入力。</div><form id="new-form"><div class="field"><label>名前（必須）</label><input required maxlength="100" class="input" name="name" placeholder="例：山田さん" autofocus></div><div class="field"><label>紹介者</label><input class="input" name="introducer" maxlength="100" placeholder="例：花本良"></div><div class="field"><label>担当者</label><input class="input" name="owner" maxlength="100" placeholder="例：花本良"></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">キャンセル</button><button type="submit" class="btn primary">登録する</button></div></form>`)}
function backupModal(){openModal(`<h2>バックアップ・復元</h2><p class="small-muted">情報はこの端末のブラウザに保存されます。取り込み前にバックアップを保存してください。『ゲストシートを更新・追加』なら、既存人物のシート情報だけを更新し、活動進捗・セミナー履歴・送信履歴は維持します。</p><div class="note notice-warn"><strong>注意：</strong>バックアップは暗号化されていません。個人情報を含む状態では、他人に送信したり、公開フォルダへ置いたりしないでください。</div><div class="actionrow" style="margin-top:15px"><button class="btn primary" data-action="export">バックアップを保存</button><button class="btn dark" data-action="choose-import-update">ゲストシートを更新・追加</button><button class="btn" data-action="choose-import-merge">空欄だけ補完</button><button class="btn" data-action="choose-import-replace">全件置き換え（復元）</button></div><input id="backup-file" class="hidden" type="file" accept="application/json,.json"><div class="modal-actions"><button class="btn" data-action="close-modal">閉じる</button></div>`)}
async function copy(txt){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);return true}const el=document.createElement('textarea');el.value=txt;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.focus();el.select();const ok=document.execCommand('copy');el.remove();return ok}catch(e){return false}}
async function shareSheet(){const p=person();const txt=sheetText(p,ui.sheet);if(navigator.share){try{await navigator.share({title:`${p.name}・${SHEETS.find(s=>s.id===ui.sheet).title}`,text:txt});toast('共有操作を完了しました。実際の送信済み記録は別途行ってください。');return}catch(e){if(e.name==='AbortError')return}}const okay=await copy(txt);toast(okay?'共有できない環境のため、本文をコピーしました。':'共有できませんでした。コピー機能をお試しください。')}
function updateField(field,value){const p=person();if(!p)return;p[field]=value;p.updatedAt=new Date().toISOString();save()}
function changeView(view){if(['sheet','progress'].includes(view)&&!person()){if(people.length){ui.personId=people[0].id}else{ui.view='list';render();toast('先に人物を登録してください。');return}}ui.view=view;render();window.scrollTo({top:0,behavior:'instant'})}

function importRecords(payload,mode){
 if(!payload || payload.app!=='RE:RISE Manager' || !Array.isArray(payload.people) || payload.people.length>3000) throw Error('形式が一致しません');
 if(payload.people.some(p=>!p || typeof p!=='object' || typeof p.name!=='string' || !p.name.trim() || p.name.length>120)) throw Error('人物データに不正な項目があります');
 const next=payload.people.map(p=>({...p,id:String(p.id||uid()),checks:p.checks&&typeof p.checks==='object'?p.checks:{},sessions:Array.isArray(p.sessions)?p.sessions:[],sharedHistory:Array.isArray(p.sharedHistory)?p.sharedHistory:[]}));
 if(mode==='replace'){
  if(!confirm(`既存の${people.length}名を削除して、読み込んだ${next.length}名で置き換えます。よろしいですか？`))return null;
  people=next;return {added:next.length,filled:0,skipped:0};
 }
 if(mode==='update'){
  // Only public schema fields belonging to guest sheets are updateable. Never overwrite progress/registration history.
  const writable=new Set(['age','location','job','personality','family','relation','features','health','economy','freeTime','friends','hobbies','approach','reason','introducer','networkExperience']);
  const norm=x=>String(x||'').replace(/[\s　・さん様]/g,'').toLowerCase();
  const matching=next.filter(p=>people.some(old=>norm(old.name)===norm(p.name)));
  const adding=next.filter(p=>!people.some(old=>norm(old.name)===norm(p.name)));
  const names=next.map(p=>p.name).join('、');
  if(!confirm(`ゲストシート更新を実行しますか？\n既存 ${matching.length}名を更新・新規 ${adding.length}名を追加\n対象：${names}\n\n既存の活動進捗・参加履歴・送信履歴・登録状況は保持します。`))return null;
  let changed=0;
  for(const incoming of next){
   const old=people.find(p=>norm(p.name)===norm(incoming.name));
   if(!old){
    // Keep add-only defaults without treating a planned outreach as completed.
    people.push({...incoming,stage:'アポ前',nextAction:'',nextDate:'',owner:incoming.introducer||'',checks:{},sessions:[],sharedHistory:[],registrationDate:'',createdAt:new Date().toISOString()});
    continue;
   }
   for(const key of writable){
    if(!Object.hasOwn(incoming,key))continue;
    const value=incoming[key];
    if(typeof value!=='string'||!value.trim())continue;
    if(old[key]!==value){old[key]=value;changed++;}
   }
   old.updatedAt=new Date().toISOString();
  }
  return {added:adding.length,filled:changed,skipped:0,updated:matching.length};
 }
 let added=0,filled=0,skipped=0;
 for(const incoming of next){
  const norm=x=>String(x||'').replace(/[\s　・さん様]/g,'').toLowerCase();
  const old=people.find(p=>norm(p.name)===norm(incoming.name));
  if(!old){people.push(incoming);added++;continue;}
  for(const [key,value] of Object.entries(incoming)){
   if(['id','name','createdAt','updatedAt','sharedHistory','sourceNote'].includes(key))continue;
   if(key==='checks' && value && typeof value==='object'){
    old.checks=old.checks||{};
    for(const [ck,cv] of Object.entries(value)){if(old.checks[ck]===undefined){old.checks[ck]=cv;filled++;}}
   }else if(key==='sessions'&&Array.isArray(value)){
    old.sessions=old.sessions||[];
    for(const s of value){if(!old.sessions.some(prev=>prev.type===s.type && prev.date===s.date)){old.sessions.push(s);filled++;}}
   }else if((old[key]===undefined || old[key]===null || old[key]==='') && value!==undefined && value!==null && value!=='' && !Array.isArray(value) && typeof value!=='object'){
    old[key]=value;filled++;
   }else skipped++;
  }
 }
 return {added,filled,skipped};
}
document.addEventListener('click',async e=>{if(e.target.dataset.backdrop){closeModal();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;const p=person();
 if(a==='go-list'){ui.filter='すべて';ui.search='';changeView('list');return}
 if(a==='go-due'){ui.filter='要対応';ui.search='';changeView('list');return}
 if(a==='go-settings'){changeView('settings');return}
 if(a==='go-sheet'||a==='go-progress'){changeView(a.slice(3));return}
 if(a==='new-person'){newPersonModal();return}
 if(a==='close-modal'){closeModal();return}
 if(a==='backup'){backupModal();return}
 if(a==='cloud-config'){cloudConfigSave();return}
 if(a==='cloud-login'){cloudSignIn();return}
 if(a==='cloud-pull'){await cloudPull();return}
 if(a==='cloud-flush'){if(!cloud.ready){toast('先にクラウドから読み込んでください');return}await cloudFlush();return}
 if(a==='open-person'){ui.personId=b.dataset.id;ui.sheet='new';ui.mode='edit';changeView('sheet');return}
 if(a==='sheet-type'){ui.sheet=b.dataset.id;ui.mode='edit';render();return}
 if(a==='mode'){ui.mode=b.dataset.id;render();return}
 if(a==='copy-sheet'){const ok=await copy(sheetText(p,ui.sheet));toast(ok?'ゲストシート全文をコピーしました。':'コピーできませんでした。プレビューから手動でコピーしてください。');return}
 if(a==='share-sheet'){await shareSheet();return}
 if(a==='record-send'){p.sharedHistory=p.sharedHistory||[];p.sharedHistory.push({type:ui.sheet,at:new Date().toISOString(),snapshot:sheetText(p,ui.sheet)});save();render();toast('送信済みとして記録しました。');return}
 if(a==='delete-person'){if(confirm(`${p.name}さんの情報を削除します。元に戻せません。よろしいですか？`)){people=people.filter(x=>x.id!==p.id);save();ui.personId=null;changeView('list');toast('削除しました。')}return}
 if(a==='add-seminar'){const type=document.getElementById('seminar-type').value;const date=document.getElementById('seminar-date').value;p.sessions=p.sessions||[];p.sessions.push({id:uid(),type,date});if(type==='フェロートレーニング'){p.checks=p.checks||{};p.checks.fellow=true}save();render();toast('参加履歴を追加しました。');return}
 if(a==='remove-seminar'){if(confirm('この参加履歴を削除しますか？')){p.sessions=p.sessions.filter(s=>s.id!==b.dataset.id);save();render()}return}
 if(a==='export'){const data=JSON.stringify({app:'RE:RISE Manager',version:1,exportedAt:new Date().toISOString(),people},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const an=document.createElement('a');an.href=url;an.download='RE-RISE-backup-'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.appendChild(an);an.click();an.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('バックアップを保存しました。');return}
 if(a==='choose-import-merge'||a==='choose-import-replace'||a==='choose-import-update'){importMode=a==='choose-import-update'?'update':a==='choose-import-merge'?'merge':'replace';document.getElementById('backup-file').click();return}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;renderPeople();return}if(e.target.dataset.field)updateField(e.target.dataset.field,e.target.value)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='filter'){ui.filter=t.value;render();return}if(t.dataset.check){const p=person();p.checks=p.checks||{};p.checks[t.dataset.check]=t.checked;if(t.dataset.check==='registered' && t.checked && ['アポ前','アポ調整中','説明後'].includes(p.stage))p.stage='登録済み';save();render();return}if(t.dataset.field){updateField(t.dataset.field,t.value);if(['name','stage','owner','introducer','nextAction','nextDate'].includes(t.dataset.field))render();return}if(t.id==='seminar-type'){ui.seminarType=t.value;return}if(t.id==='seminar-date'){ui.seminarDate=t.value;return}if(t.id==='backup-file'){const f=t.files?.[0];if(!f)return;f.text().then(raw=>{try{const j=JSON.parse(raw);if(j.app!=='RE:RISE Manager'||!Array.isArray(j.people))throw Error('形式が一致しません');const report=importRecords(j,importMode);if(!report)return;save();closeModal();ui.view='list';ui.personId=null;ui.filter='すべて';render();toast(importMode==='update'?`更新完了：${report.updated}人更新・${report.added}人追加・${report.filled}項目変更`:`取り込み完了：${report.added}人追加・${report.filled}項目補完`);}catch(err){toast('読み込みに失敗：'+(err.message||'ファイル形式を確認してください。'))}});return}});
document.addEventListener('submit',e=>{if(e.target.id==='new-form'){e.preventDefault();const form=new FormData(e.target);const name=String(form.get('name')||'').trim();if(!name)return;const p={id:uid(),name,introducer:String(form.get('introducer')||''),owner:String(form.get('owner')||''),stage:'アポ前',nextAction:'',nextDate:'',checks:{},sessions:[],sharedHistory:[],createdAt:new Date().toISOString()};people.unshift(p);save();closeModal();ui.personId=p.id;ui.sheet='new';ui.mode='edit';changeView('sheet');toast('人物を登録しました。')}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>
