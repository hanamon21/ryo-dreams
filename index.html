min-height:520px;border:1px solid #ffffff18;border-radius:27px;overflow:hidden;position:relative;box-shadow:0 18px 42px #0005;background:#091d34;touch-action:pan-y;user-select:none}.swipe-photo{position:absolute;inset:0;background-repeat:no-repeat;background-size:cover;background-position:center;transform:scale(1.02);transition:background-image .2s ease}.swipe-shade{position:absolute;inset:0;background:linear-gradient(180deg,#00000005 15%,#00000018 40%,#06172cd9 68%,#06172c 100%)}.swipe-content{position:absolute;left:0;right:0;bottom:0;padding:23px 20px 22px}.swipe-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.badge{display:flex;align-items:center;gap:9px}.swipe-num{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#10233a;display:grid;place-items:center;font-weight:950}.swipe-cat{font-size:12px;color:#f7d783;font-weight:900}.counter{font-size:12px;color:#cbd9e5;font-weight:800}.swipe-title{font-size:23px;line-height:1.5;font-weight:950;text-shadow:0 2px 10px #0009}.nav{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;margin-top:13px}.arrow{width:46px;height:46px;border-radius:50%;border:1px solid #ffffff20;background:#ffffff0e;color:white;font-size:25px}.dots{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;max-width:240px;margin:auto}.dot{width:6px;height:6px;border-radius:50%;background:#63798e}.dot.active{width:20px;border-radius:8px;background:var(--gold)}.hint{text-align:center;color:#879db1;font-size:12px;margin-top:9px}.board{background:linear-gradient(145deg,#0d2c4c,#091e35);border:1px solid #ffffff14;border-radius:24px;padding:10px;box-shadow:0 14px 34px #0004}.board img{width:100%;display:block;border-radius:16px;cursor:pointer}.boardnote{color:var(--muted);font-size:13px;line-height:1.6;padding:10px 2px 2px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000e;padding:14px;z-index:100}.modal.open{display:flex} </style></head><body><div class="wrap"><div class="kicker">RYO'S VISION</div><h1>20の夢</h1><div class="sub">好きなときに、好きな人と、好きなことを。<br>20の夢を、1枚ずつイメージしながら見る自分専用ビジョンアプリ。</div><div class="tabs" aria-label="表示切り替え"><button class="tab active" data-v="list"><span class="tabicon">▦</span><span>一覧</span></button><button class="tab" data-v="swipe"><span class="tabicon">◇</span><span>スワイプ</span></button><button class="tab" data-v="board"><span class="tabicon">✦</span><span>夢ボード</span></button></div><section class="view active" id="list"><div class="today ultimate" aria-label="最終目標"><small>✦ 最終目標　/　ULTIMATE VISION</small><p class="goal-primary">ナチュラリープラスで<strong>10億円</strong>を稼ぐ。</p><p class="goal-secondary">サロンに自分の写真が飾られる実績をつくり、人生を終えたあとも、自分の名前と挑戦の証を後世に残す。</p></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section><section class="view" id="swipe"><div class="swipe-card" id="swipeCard"><div class="swipe-photo" id="swipePhoto"></div><div class="swipe-shade"></div><div class="swipe-content"><div class="swipe-head"><div class="badge"><div class="swipe-num" id="snum"></div><div class="swipe-cat" id="scat"></div></div><div class="counter" id="count"></div></div><div class="swipe-title" id="stitle"></div></div></div><div class="nav"><button class="arrow" id="prev">‹</button><div class="dots" id="dots"></div><button class="arrow" id="next">›</button></div><div class="hint">左右にスワイプして夢をめくる</div></section><section class="view" id="board"><div class="board"><img src="images/vision-board.jpg" id="boardImg" alt="RYO 20の夢ボード"><div class="boardnote">20個を一気に眺めたい時はこちら。画像をタップすると大きく表示できます。</div></div></section><div class="footer">Dream Big. Live Freely.</div></div><div class="modal" id="modal"><button class="close" id="close">×</button><div class="modalbox"><img id="modalImg" src="images/vision-board.jpg" alt="夢ボード"></div></div><script>
const dreams=[{"id":1,"cat":"自由","text":"時間・お金・場所に縛られず、大切な人と好きなことを選べる人生を送る","img":"images/dream-01.jpg"},{"id":2,"cat":"自由","text":"朝起きて「今日は何をしよう」とワクワクできる毎日を送る","img":"images/dream-02.jpg"},{"id":3,"cat":"NP","text":"ナチュラリープラスでCFCタイトルを達成し、月収240万円を実現する","img":"images/dream-03.jpg"},{"id":4,"cat":"収入","text":"年収1億円を達成する","img":"images/dream-04.jpg"},{"id":5,"cat":"自由","text":"仕事は週2〜3日、1日2〜3時間程度にして、働く時間を自分で決める","img":"images/dream-05.jpg"},{"id":6,"cat":"NP","text":"ナチュラリープラス一本で生活しながら、仕事というより楽しみや趣味のような感覚で続ける","img":"images/dream-06.jpg"},{"id":7,"cat":"大切な人","text":"家族・恋人・友人との時間を最優先し、大切な日にはいつでも一緒に過ごせる生活をする","img":"images/dream-07.jpg"},{"id":8,"cat":"大切な人","text":"家族に毎月十分な仕送りをし、お金の心配をさせず、旅行や食事など様々な経験をプレゼントできるようになる","img":"images/dream-08.jpg"},{"id":9,"cat":"体験","text":"パートナーと世界中のディズニーパークを巡り、制覇する","img":"images/dream-09.jpg"},{"id":10,"cat":"体験","text":"思い立ったときにオーロラを見に行ける生活をする","img":"images/dream-10.jpg"},{"id":11,"cat":"仲間","text":"仲間とUSJを貸し切って思いきり遊ぶ","img":"images/dream-11.jpg"},{"id":12,"cat":"人生","text":"収入・仲間・時間・健康が満たされた人生を送る","img":"images/dream-12.jpg"},{"id":13,"cat":"人生","text":"「自分はこのために生まれてきた」と思える仕事と生き方を見つける","img":"images/dream-13.jpg"},{"id":14,"cat":"健康","text":"スノーボードなどアクティブな遊びを、年齢を気にせず楽しみ続ける","img":"images/dream-14.jpg"},{"id":15,"cat":"仲間","text":"ナチュラリープラスで、人生を豊かにする仲間が集まるコミュニティをつくる","img":"images/dream-15.jpg"},{"id":16,"cat":"NP","text":"ナチュラリープラスで、仲間が収入を得られるよう支えられる人になる","img":"images/dream-16.jpg"},{"id":17,"cat":"人生","text":"誰かの人生に良い影響を与え、夢を叶えるきっかけや支えになれる人になる","img":"images/dream-17.jpg"},{"id":18,"cat":"人生","text":"年齢を重ねても自分らしく生き、若い世代から尊敬されるお手本のような存在になる","img":"images/dream-18.jpg"},{"id":19,"cat":"健康","text":"生涯健康で、自分の足で動き、好きなことを楽しめる身体を保つ","img":"images/dream-19.jpg"},{"id":20,"cat":"人生","text":"人生の最後に、多くの人から「出会えてよかった」と思ってもらえる生き方をする","img":"images/dream-20.jpg"}];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const favs=new Set(JSON.parse(localStorage.getItem('ryoFavs')||'[]'));let cat='すべて';let si=Math.max(0,Math.min(19,Number(localStorage.getItem('ryoDreamIndex')||0)));function imageStyle(d){return `background-image:linear-gradient(180deg,#0000 35%,#03111e88 100%),url('${d.img}')`}$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.v));localStorage.setItem('ryoView',b.dataset.v)});const saved=localStorage.getItem('ryoView');if(saved)$(`.tab[data-v="${saved}"]`)?.click();function filters(){const cats=['すべて',...new Set(dreams.map(d=>d.cat))];$('#filters').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;filters();list()};$('#filters').appendChild(b)})}function list(){$('#grid').innerHTML='';dreams.forEach((d,i)=>{if(cat!=='すべて'&&d.cat!==cat)return;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="visual" style="${imageStyle(d)}"></div><div class="cardbody"><div class="meta"><div class="num">${d.id}</div><div class="cat">${d.cat}</div></div><div class="txt">${d.text}</div><div class="actions"><button class="star ${favs.has(i)?'on':''}">★</button></div></div>`;el.querySelector('.visual').onclick=()=>openImage(d.img);el.querySelector('.star').onclick=()=>{favs.has(i)?favs.delete(i):favs.add(i);localStorage.setItem('ryoFavs',JSON.stringify([...favs]));list()};$('#grid').appendChild(el)})}function renderSwipe(){const d=dreams[si];$('#swipePhoto').style.cssText=`background-image:url('${d.img}')`;$('#snum').textContent=d.id;$('#scat').textContent=d.cat;$('#stitle').textContent=d.text;$('#count').textContent=`${si+1} / 20`;$('#dots').innerHTML='';dreams.forEach((_,i)=>{const e=document.createElement('span');e.className='dot'+(i===si?' active':'');$('#dots').appendChild(e)});localStorage.setItem('ryoDreamIndex',si)}function go(n){si=(si+n+20)%20;renderSwipe()}$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);$('#swipePhoto').onclick=()=>openImage(dreams[si].img);let sx=0,dx=0;$('#swipeCard').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0},{passive:true});$('#swipeCard').addEventListener('touchmove',e=>dx=e.touches[0].clientX-sx,{passive:true});$('#swipeCard').addEventListener('touchend',()=>{if(Math.abs(dx)>55)go(dx<0?1:-1)});function openImage(src){$('#modalImg').src=src;$('#modal').classList.add('open')}function openBoard(){openImage($('#boardImg').src)}$('#boardImg').onclick=openBoard;$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};filters();list();renderSwipe();
</script></body></html>
