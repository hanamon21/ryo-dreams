const dreams=[{"id": 1, "cat": "自由", "text": "時間・お金・場所に縛られず、大切な人と好きなことを選べる人生を送る", "x": 18, "y": 17}, {"id": 2, "cat": "自由", "text": "朝起きて「今日は何をしよう」とワクワクできる毎日を送る", "x": 18, "y": 25}, {"id": 3, "cat": "NP", "text": "ナチュラリープラスでCFCタイトルを達成し、月収240万円を実現する", "x": 18, "y": 33}, {"id": 4, "cat": "収入", "text": "年収1億円を達成する", "x": 18, "y": 41}, {"id": 5, "cat": "自由", "text": "仕事は週2〜3日、1日2〜3時間程度にして、働く時間を自分で決める", "x": 18, "y": 49}, {"id": 6, "cat": "NP", "text": "ナチュラリープラス一本で生活しながら、仕事というより楽しみや趣味のような感覚で続ける", "x": 18, "y": 57}, {"id": 7, "cat": "大切な人", "text": "家族・恋人・友人との時間を最優先し、大切な日にはいつでも一緒に過ごせる生活をする", "x": 18, "y": 65}, {"id": 8, "cat": "大切な人", "text": "家族に毎月十分な仕送りをし、お金の心配をさせず、旅行や食事など様々な経験をプレゼントできるようになる", "x": 18, "y": 73}, {"id": 9, "cat": "体験", "text": "パートナーと世界中のディズニーパークを巡り、制覇する", "x": 18, "y": 81}, {"id": 10, "cat": "体験", "text": "思い立ったときにオーロラを見に行ける生活をする", "x": 18, "y": 89}, {"id": 11, "cat": "仲間", "text": "仲間とUSJを貸し切って思いきり遊ぶ", "x": 82, "y": 17}, {"id": 12, "cat": "人生", "text": "収入・仲間・時間・健康が満たされた人生を送る", "x": 82, "y": 25}, {"id": 13, "cat": "人生", "text": "「自分はこのために生まれてきた」と思える仕事と生き方を見つける", "x": 82, "y": 33}, {"id": 14, "cat": "健康", "text": "スノーボードなどアクティブな遊びを、年齢を気にせず楽しみ続ける", "x": 82, "y": 41}, {"id": 15, "cat": "仲間", "text": "ナチュラリープラスで、人生を豊かにする仲間が集まるコミュニティをつくる", "x": 82, "y": 49}, {"id": 16, "cat": "NP", "text": "ナチュラリープラスで、仲間が収入を得られるよう支えられる人になる", "x": 82, "y": 57}, {"id": 17, "cat": "人生", "text": "誰かの人生に良い影響を与え、夢を叶えるきっかけや支えになれる人になる", "x": 82, "y": 65}, {"id": 18, "cat": "人生", "text": "年齢を重ねても自分らしく生き、若い世代から尊敬されるお手本のような存在になる", "x": 82, "y": 73}, {"id": 19, "cat": "健康", "text": "生涯健康で、自分の足で動き、好きなことを楽しめる身体を保つ", "x": 82, "y": 81}, {"id": 20, "cat": "人生", "text": "人生の最後に、多くの人から「出会えてよかった」と思ってもらえる生き方をする", "x": 82, "y": 89}];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const favs=new Set(JSON.parse(localStorage.getItem('ryoFavs')||'[]'));let cat='すべて';let si=Math.max(0,Math.min(19,Number(localStorage.getItem('ryoDreamIndex')||0)));function cropStyle(d){return `background-position:${d.x}% ${d.y}%`}$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));$$('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.v));localStorage.setItem('ryoView',b.dataset.v)});const saved=localStorage.getItem('ryoView');if(saved)$(`.tab[data-v="${saved}"]`)?.click();function filters(){const cats=['すべて',...new Set(dreams.map(d=>d.cat))];$('#filters').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;filters();list()};$('#filters').appendChild(b)})}function list(){$('#grid').innerHTML='';dreams.forEach((d,i)=>{if(cat!=='すべて'&&d.cat!==cat)return;const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="visual" style="${cropStyle(d)}"></div><div class="cardbody"><div class="meta"><div class="num">${d.id}</div><div class="cat">${d.cat}</div></div><div class="txt">${d.text}</div><div class="actions"><button class="star ${favs.has(i)?'on':''}">★</button></div></div>`;el.querySelector('.visual').onclick=()=>openBoard();el.querySelector('.star').onclick=()=>{favs.has(i)?favs.delete(i):favs.add(i);localStorage.setItem('ryoFavs',JSON.stringify([...favs]));list()};$('#grid').appendChild(el)})}function renderSwipe(){const d=dreams[si];$('#swipePhoto').style.cssText=cropStyle(d);$('#snum').textContent=d.id;$('#scat').textContent=d.cat;$('#stitle').textContent=d.text;$('#count').textContent=`${si+1} / 20`;$('#dots').innerHTML='';dreams.forEach((_,i)=>{const e=document.createElement('span');e.className='dot'+(i===si?' active':'');$('#dots').appendChild(e)});localStorage.setItem('ryoDreamIndex',si)}function go(n){si=(si+n+20)%20;renderSwipe()}$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);let sx=0,dx=0;$('#swipeCard').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0},{passive:true});$('#swipeCard').addEventListener('touchmove',e=>dx=e.touches[0].clientX-sx,{passive:true});$('#swipeCard').addEventListener('touchend',()=>{if(Math.abs(dx)>55)go(dx<0?1:-1)});function openBoard(){$('#modal').classList.add('open')}$('#boardImg').onclick=openBoard;$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};const now=new Date();$('#today').textContent=dreams[(now.getFullYear()*372+now.getMonth()*31+now.getDate())%20].text;filters();list();renderSwipe();
</script></body></html>
